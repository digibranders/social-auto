<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Sign in · Content Calendar</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/assets/web/login.js"></script>
  </head>
  <body class="login-page">
    <main class="login">
      <img class="login-logo" src="/logo.svg" alt="" width="56" height="56" />
      <h1>Content Calendar</h1>
      <p class="muted">Sign in to see what is scheduled and what has gone out.</p>
      <form id="login-form">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button id="submit" class="btn btn-primary" type="submit">Sign in</button>
        <p id="message" class="form-error" role="alert"></p>
      </form>
    </main>
  </body>
</html>
