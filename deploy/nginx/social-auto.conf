# One address for both apps. The dashboard is the site; the publisher sits under /publisher/ (its public addresses:
# poster pictures for Instagram, the product API, and the status feed). Both only listen on this machine.
# Certificates: `certbot --nginx -d social.digibranders.com` completes the https part of this file.
server {
    listen 80;
    listen [::]:80;
    server_name social.digibranders.com;

    client_max_body_size 8m;

    location /publisher/ {
        proxy_pass http://127.0.0.1:4021/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:4011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
